name: 每日日本新聞與 VSPO 剪輯更新排程

on:
  schedule:
    # 每天台灣時間早上 08:30 (UTC+8) = UTC 00:30
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-content-update
  cancel-in-progress: false

jobs:
  update-daily-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily RSS, YouTube & Gemini update script
        run: node scripts/update-daily.mjs

      - name: Commit and push daily-content.json and history.json
        run: |
          if [ -n "$(git status --porcelain public/data/daily-content.json public/data/history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/daily-content.json public/data/history.json
            git commit -m "chore: update daily-content.json ($(TZ=Asia/Taipei date +%Y-%m-%d))"
            git push
          else
            echo "public/data/daily-content.json 與 history.json 無變更，略過 commit。"
          fi
